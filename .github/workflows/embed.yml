name: corpus-embed
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
concurrency: { group: corpus-embed, cancel-in-progress: false }
jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q onnxruntime tokenizers huggingface_hub numpy requests
      - run: python -c "from huggingface_hub import hf_hub_download as d; [d('Supabase/gte-small', f, local_dir='model') for f in ['tokenizer.json','onnx/model.onnx']]"
      - run: python -u worker.py
        env:
          GTE_SECRET: ${{ secrets.GTE_SECRET }}
          SHARD: ${{ matrix.shard }}
          SHARDS: "8"
          MAX_SECONDS: "19800"
